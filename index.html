<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Banana Racer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9ec9e8;font-family:system-ui,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55)}
  #top{position:absolute;top:8px;left:68px;font-size:20px;font-weight:700;line-height:1.35}
  #top small{font-weight:500;opacity:.9;font-size:14px}
  #speed{position:absolute;right:18px;bottom:18px;text-align:right;font-weight:800;font-size:44px;line-height:1}
  #speed span{font-size:16px;font-weight:600;opacity:.9}
  #boostWrap{position:absolute;right:18px;bottom:76px;width:150px;height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
  #boost{height:100%;width:100%;background:linear-gradient(90deg,#ffd23f,#ff7a00)}
  #msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:80px;font-weight:900;letter-spacing:2px}
  #sub{position:absolute;left:0;right:0;top:calc(30% + 96px);text-align:center;font-size:20px;font-weight:600;white-space:pre-line}
  #driftTxt{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:30px;font-weight:900;letter-spacing:2px}
  #help{position:absolute;left:16px;bottom:14px;font-size:13px;opacity:.9;line-height:1.5}
  #loading{position:fixed;inset:0;background:#1d2b3a;color:#fff;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:22px;z-index:10;text-align:center;padding:20px}
  #loading small{font-size:15px;opacity:.85;max-width:560px;line-height:1.5}
  .tbtn{position:fixed;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.6);color:#fff;display:none;align-items:center;justify-content:center;z-index:5;font-weight:700;touch-action:none}
  .tbtn.on{background:rgba(255,210,63,.7)}
  #select{position:fixed;left:0;right:0;bottom:24px;display:none;flex-direction:column;align-items:center;gap:6px;z-index:6;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #select .title{font-size:13px;font-weight:700;opacity:.85;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
  .selRow{display:flex;align-items:center;gap:16px}
  .selName{min-width:270px;text-align:center;font-size:30px;font-weight:900}
  #trkName{font-size:22px}
  #select button,.fileBtn{font:inherit;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);border-radius:14px}
  .arrow{width:50px;height:46px;font-size:22px}
  #selGo{padding:12px 34px;font-size:22px;font-weight:800;background:#ff9d00!important;border-color:#ffd23f!important;margin-top:6px}
  #selGo:disabled{opacity:.55;cursor:default}
  .fileBtn{display:inline-block;padding:8px 14px;font-size:14px}
  #selHint{font-size:13px;opacity:.9}
  #records{font-size:13px;opacity:.95;margin-top:2px}
  #resetRec{font-size:11px;padding:2px 8px;opacity:.7;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.25);color:#fff;cursor:pointer;margin-left:6px}
  #selMsg{font-size:14px;color:#ffd6d6;min-height:18px;max-width:90vw;text-align:center}
  #topBar{position:fixed;top:10px;left:10px;z-index:8;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  #topPanel{display:none;flex-direction:column;gap:8px}
  #topBar.open #topPanel{display:flex}
  #menuToggle{width:46px;padding:0;font-size:22px}
  #topPanel .topBtn{min-width:210px;justify-content:flex-start;gap:10px}
  #topPanel .topBtn kbd{margin-left:auto}
  .ico{display:inline-flex;width:24px;justify-content:center}
  .topBtn{height:46px;min-width:46px;border-radius:12px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.75);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;font:600 14px system-ui,sans-serif}
  .topBtn kbd{font:600 11px system-ui,sans-serif;border:1px solid rgba(255,255,255,.7);border-radius:5px;padding:1px 5px;opacity:.85}
  body.in-select #restartBtn,body.in-select #menuBtn{display:none}
  .topBtn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #ctrlBtn{display:none}

  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:84vw;text-align:center;display:none}
  #touchZones{position:fixed;inset:0;z-index:3;display:none;touch-action:none}
  .zone{position:absolute;bottom:22px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .zone.on{background:rgba(255,210,63,.55)}
  #zL{left:24px} #zR{right:24px}
  body.ctrl-buttons:not(.in-select) .tbtn{display:flex}
  body.ctrl-buttons .tbtn.on{background:rgba(255,210,63,.7)}
  body.ctrl-touch:not(.in-select) #touchZones{display:block}
  @media (pointer:coarse){
    #ctrlBtn{display:flex} #gasBtn{display:none} #help{display:none} .topBtn kbd{display:none}
    #speed{top:8px;right:14px;bottom:auto;font-size:36px;text-align:right}
    #boostWrap{top:56px;right:14px;bottom:auto}
    #driftTxt{bottom:140px}
  }
  @media (max-width:520px){#speed{top:60px!important}#boostWrap{top:108px!important}}
  @media (max-height:520px){
    #select{bottom:6px;gap:2px}
    #select .title{display:none}
    .selName{font-size:22px;min-width:200px} #trkName{font-size:17px}
    .arrow{width:40px;height:34px;font-size:17px}
    #selGo{padding:7px 26px;font-size:17px;margin-top:2px}
    #selHint,.fileBtn{font-size:11px;padding:4px 10px}
    #msg{font-size:56px} #sub{top:calc(30% + 70px);font-size:16px}
  }
</style>
</head>
<body>
<div id="topBar">
  <button id="menuToggle" class="topBtn" aria-label="Menu" aria-expanded="false">☰</button>
  <div id="topPanel">
    <button id="fsBtn" class="topBtn" title="Fullscreen"><span class="ico" id="fsIcon"></span><span>Fullscreen</span></button>
    <button id="ctrlBtn" class="topBtn"><span class="ico">🎮</span><span id="ctrlLabel">Controls: Touch</span></button>
    <button id="gasBtn" class="topBtn" title="Automatic gas (G)"><span class="ico">⛽</span><span id="gasLabel">Auto gas: Off</span><kbd>G</kbd></button>
    <button id="restartBtn" class="topBtn" title="Restart race (Enter)"><span class="ico">↻</span><span>Restart</span><kbd>Enter</kbd></button>
    <button id="menuBtn" class="topBtn" title="Car / track menu (C)"><span class="ico">🏁</span><span>Car / track</span><kbd>C</kbd></button>
  </div>
</div>
<div id="toast"></div>
<div id="touchZones"><div class="zone" id="zL">◀</div><div class="zone" id="zR">▶</div></div>
<div id="loading"><div id="loadMsg">Loading Banana Racer…</div><small id="loadSub"></small></div>
<div id="hud">
  <div id="top"></div>
  <div id="msg"></div>
  <div id="sub"></div>
  <div id="boostWrap"><div id="boost"></div></div>
  <div id="driftTxt"></div>
  <div id="speed">0 <span>km/h</span></div>
  <div id="help">↑/W gas &nbsp; ↓/S brake &nbsp; ←→/AD steer &nbsp; <b>Space</b> jump &nbsp; Shift boost &nbsp; <b>Drift:</b> hold ← then tap → (or → then ←) &nbsp; G auto gas &nbsp; R reset car &nbsp; Enter restart &nbsp; C car/track menu &nbsp; M mute</div>
</div>
<div id="select">
  <div class="title">Car</div>
  <div class="selRow"><button class="arrow" id="selPrev">◀</button><div class="selName" id="selName">…</div><button class="arrow" id="selNext">▶</button></div>
  <div class="title">Track</div>
  <div class="selRow"><button class="arrow" id="trkPrev">◀</button><div class="selName" id="trkName">…</div><button class="arrow" id="trkNext">▶</button></div>
  <div><span id="records"></span><button id="resetRec">reset</button></div>
  <button id="selGo" disabled>LOADING…</button>
  <div id="selHint">←/→ car · ↑/↓ track · Enter to start</div>
  <label class="fileBtn">＋ Add .glb (car / track) or a background image<input type="file" id="fileIn" accept=".glb,.jpg,.jpeg,.png,.webp" multiple hidden></label>
  <div id="selMsg"></div>
</div>
<div class="tbtn" id="bL" style="left:18px;bottom:22px;width:104px;height:104px;font-size:42px">◀</div>
<div class="tbtn" id="bR" style="left:138px;bottom:22px;width:104px;height:104px;font-size:42px">▶</div>
<div class="tbtn" id="bB" style="right:140px;bottom:130px;width:84px;height:84px;font-size:16px">NOS</div>
<div class="tbtn" id="bJ" style="right:150px;bottom:22px;width:96px;height:96px;font-size:18px">JUMP</div>
<div class="tbtn" id="bG" style="right:18px;bottom:22px;width:116px;height:116px;font-size:20px">GAS</div>
<div class="tbtn" id="bBr" style="right:18px;bottom:152px;width:96px;height:96px;font-size:18px">BRK</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/racingline.js?v=20261030"></script>
<script src="js/game.js?v=20261030"></script>
</body>
</html>
